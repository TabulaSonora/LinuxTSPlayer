name: Build

# Every push to main, every pull request, and every tag. The build is cached hard enough that an
# ordinary commit only recompiles this project, so running it on all of them is cheap; a tag
# additionally publishes the bundle as a release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still building makes the first pointless. Tags are exempt:
# cancelling one would cancel a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest

    # The GNOME 50 image, matching the runtime the manifest asks for, so flatpak-builder and the
    # runtime are already present. --privileged is what flatpak-builder needs to set up its own
    # sandbox inside this one.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The engine is a submodule, and the manifest copies the working tree, so it has to be a
          # real checkout rather than an empty directory.
          submodules: recursive
          fetch-depth: 0

      - name: Trust the checkout
        # The container runs as a different user than the one that cloned.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          # flatpak-builder keeps downloaded sources and per-module build results here, and skips
          # any module whose inputs are unchanged. nlohmann/json is the expensive one and its
          # inputs never move, so in practice only this project is recompiled per commit.
          path: .flatpak-builder
          # Keyed by commit so each run saves an updated cache, with the manifest hash in the
          # prefix: change a dependency version and the fallbacks below stop matching, which is
          # exactly when the old build results stop being valid.
          key: flatpak-gnome50-${{ hashFiles('packaging/flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-gnome50-${{ hashFiles('packaging/flatpak/*.yml') }}-
            flatpak-gnome50-

      - name: Build
        # Invoked directly rather than through flathub-infra/flatpak-github-actions: that action is
        # untagged and still declares node20, which GitHub is retiring, and there is no newer
        # version to move to. The image already provides everything it was doing for us.
        #
        # --disable-rofiles-fuse because the runner has no FUSE.
        run: |
          flatpak-builder \
            --disable-rofiles-fuse \
            --force-clean \
            --install-deps-from=flathub \
            --state-dir=.flatpak-builder \
            --repo=repo \
            builddir packaging/flatpak/co.losno.TabulaSonoraPlayer.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo tabula-sonora-player.flatpak co.losno.TabulaSonoraPlayer
          ls -lh tabula-sonora-player.flatpak

      - name: Name the build
        id: name
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload
        # On every run, so any commit's bundle can be downloaded and tried without cutting a tag.
        uses: actions/upload-artifact@v7
        with:
          name: tabula-sonora-player-${{ github.sha }}
          path: tabula-sonora-player.flatpak
          if-no-files-found: error

      # Every push to main is a release of its own, marked as a prerelease and explicitly not
      # "latest" so it never displaces a tagged one. A push carrying several commits produces a
      # single release covering them, which is what generate_release_notes summarises.
      - name: Publish a development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: main-${{ steps.name.outputs.short }}
          name: Development build ${{ steps.name.outputs.short }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: tabula-sonora-player.flatpak
          body: |
            An automatic build of `main` at ${{ steps.name.outputs.short }}. Unreleased work, not a
            version: for a stable build use the newest release without this notice.

            ```sh
            flatpak install --user tabula-sonora-player.flatpak
            ```

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: tabula-sonora-player.flatpak
          generate_release_notes: true
          body: |
            ## Installing

            ```sh
            flatpak install --user tabula-sonora-player.flatpak
            flatpak run co.losno.TabulaSonoraPlayer
            ```

            The synthesizer needs a copy of `SCCore.dll` from a licensed Roland SOUND Canvas VA
            1.1.6 installation — 27,347,456 bytes, SHA-256 `117e6aa1…c620bdb1`. It is not included
            and cannot be: it holds Roland's wave ROM. The application asks for it on first launch,
            reads it as data, and never loads it as code.

            MIDI input needs access to the ALSA sequencer, which is why the bundle asks for device
            access. Revoke it with `flatpak override --nodevice=all co.losno.TabulaSonoraPlayer`
            and everything except playing from a keyboard still works.

  prune:
    name: Prune old development builds
    needs: flatpak
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Not in the flatpak image: this needs the gh CLI, which the standard runner has and that
    # container does not.
    runs-on: ubuntu-latest

    steps:
      - name: Keep the ten newest
        env:
          GH_TOKEN: ${{ github.token }}
        # A release per push accumulates quickly. Only prereleases tagged main-* are considered, so
        # a tagged version is never at risk however old it gets. --cleanup-tag takes the tag with
        # the release, leaving no orphan tags behind.
        #
        # gh has jq built in, so this needs no extra tool and no inline script.
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("main-")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
