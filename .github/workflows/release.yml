name: Release

# Tag-driven: pushing v0.2.0 builds the bundle from that tag and publishes it. The manual trigger
# builds the same thing without releasing, which is how to check the manifest still works without
# spending a version number on finding out.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest

    # The GNOME 50 image, matching the runtime the manifest asks for, so the runtime and SDK are
    # already present rather than a gigabyte of download per run. --privileged is what
    # flatpak-builder needs to set up its own sandbox inside this one.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The engine is a submodule, and the manifest builds from git rather than from the
          # working tree -- so the submodule has to be a real checkout, and tags have to be
          # present for the version below.
          submodules: recursive
          fetch-depth: 0

      - name: Trust the checkout
        # The container runs as a different user than the one that cloned, and the manifest's
        # `type: git, path: ../..` source shells out to git against this directory.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: tabula-sonora-player.flatpak
          manifest-path: packaging/flatpak/co.losno.TabulaSonoraPlayer.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tabula-sonora-player.flatpak
          generate_release_notes: true
          body: |
            ## Installing

            ```sh
            flatpak install --user tabula-sonora-player.flatpak
            flatpak run co.losno.TabulaSonoraPlayer
            ```

            The synthesizer needs a copy of `SCCore.dll` from a licensed Roland SOUND Canvas VA
            1.1.6 installation — 27,347,456 bytes, SHA-256 `117e6aa1…c620bdb1`. It is not included
            and cannot be: it holds Roland's wave ROM. The application asks for it on first launch,
            reads it as data, and never loads it as code.

            MIDI input needs access to the ALSA sequencer, which is why the bundle asks for device
            access. Revoke it with `flatpak override --nodevice=all co.losno.TabulaSonoraPlayer`
            and everything except playing from a keyboard still works.
