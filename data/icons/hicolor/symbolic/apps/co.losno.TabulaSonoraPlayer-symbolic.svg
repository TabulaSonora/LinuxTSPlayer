<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Symbolic: flat, single-colour, recoloured by the theme.

    A keyboard rather than the full icon's ruled table, because at 16 pixels the ruled lines read as
    a menu button. Everything sits on half-pixel strokes and whole-pixel fills so it stays crisp at
    the nominal size.
  -->
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="2.5" y="3.5" width="11" height="9" rx="1"/>
    <path d="M5.5 8.5 V12.5 M8 8.5 V12.5 M10.5 8.5 V12.5"/>
  </g>
  <g fill="currentColor">
    <rect x="4.5" y="3" width="2" height="5.5" rx="0.5"/>
    <rect x="9.5" y="3" width="2" height="5.5" rx="0.5"/>
  </g>
</svg>
